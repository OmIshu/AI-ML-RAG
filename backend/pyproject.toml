[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbot"
version = "0.1.0"
description = "RAG chatbot over large PDF corpora (open-source stack)"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24", "pytesseract>=0.3.10", "Pillow>=10", "requests>=2.31",
  "python-dotenv>=1.0", "langdetect>=1.0.9",
  "sentence-transformers>=3.0", "torch>=2.2", "transformers>=4.40",
  "qdrant-client>=1.9", "openai>=1.40",
  "fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
